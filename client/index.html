<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Nexora — interest Spaces, community Q&amp;A, and a points economy. Your daily posting limit grows with your network."
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)" />
    <!--
      Theme must be resolved BEFORE first paint. Doing this in a React effect
      (as we used to) flashes a white screen at every cold load for dark users.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nexora_theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]:not([media])');
          if (!meta) {
            meta = document.createElement('meta');
            meta.setAttribute('name', 'theme-color');
            document.head.appendChild(meta);
          }
          meta.setAttribute('content', theme === 'dark' ? '#0B0B0F' : '#FFFFFF');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nexora" />
    <meta property="og:title" content="Nexora — build a network first, then broadcast" />
    <meta property="og:description" content="Interest Spaces, community Q&amp;A, and a points economy. Your daily posting limit grows with your network." />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexora — build a network first, then broadcast" />
    <meta name="twitter:description" content="Interest Spaces, community Q&amp;A, and a points economy. Your daily posting limit grows with your network." />
    <meta name="twitter:image" content="/og-cover.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nexora" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Nexora</title>
    <!-- Razorpay loaded on demand from Subscriptions page to avoid blocking first paint -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
