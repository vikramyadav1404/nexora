name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      # The suite injects a fake Supabase client, so no database or API keys
      # are needed — see server/test/helpers/fakeSupabase.js.
      - run: npm test

  contract:
    name: SQL contract tests (real Postgres)
    runs-on: ubuntu-latest
    # Until this job existed, nothing set CONTRACT_DB_URL in CI, so the whole
    # contract suite reported "skipped" on every run and never once executed
    # here. CONTRACT_DB_REQUIRED=1 makes a missing URL a failure, not a skip.
    # See docs/decisions/0003-verify-that-the-check-ran.md
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTRACT_DB_URL: postgres://postgres:postgres@localhost:5432/contract_scratch
      CONTRACT_DB_REQUIRED: '1'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run test:contract

  client:
    name: Client lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      # npm test was missing here until 2026-08-22. The client suite existed,
      # passed locally, and never once ran in CI -- so the badge was green
      # while nothing it claims to cover was exercised. See
      # docs/decisions/0003-verify-that-the-check-ran.md
      - run: npm test
      - run: npm run lint
      - run: npm run build

  migrations:
    name: Migration sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches the failure mode that bit us during development: a shell or
      # editor mangling a $$ dollar-quote delimiter, which Postgres only
      # rejects at apply time — long after CI would otherwise have gone green.
      - name: Check dollar-quoting is balanced
        run: |
          fail=0
          for f in server/db/migrations/*.sql; do
            n=$(grep -o '\$\$' "$f" | wc -l)
            if [ $((n % 2)) -ne 0 ]; then
              echo "::error file=$f::unbalanced \$\$ delimiters ($n found)"
              fail=1
            fi
          done
          exit $fail
