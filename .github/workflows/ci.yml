name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      # The suite injects a fake Supabase client, so no database or API keys
      # are needed — see server/test/helpers/fakeSupabase.js.
      - run: npm test

  client:
    name: Client lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  migrations:
    name: Migration sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches the failure mode that bit us during development: a shell or
      # editor mangling a $$ dollar-quote delimiter, which Postgres only
      # rejects at apply time — long after CI would otherwise have gone green.
      - name: Check dollar-quoting is balanced
        run: |
          fail=0
          for f in server/db/migrations/*.sql; do
            n=$(grep -o '\$\$' "$f" | wc -l)
            if [ $((n % 2)) -ne 0 ]; then
              echo "::error file=$f::unbalanced \$\$ delimiters ($n found)"
              fail=1
            fi
          done
          exit $fail
